<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявка отправлена — Кирилл Д.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #0f1c2e; --gold: #c9a84c; --cream: #f5f0e8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Jost', sans-serif;
      background: var(--navy);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 480px; }
    .icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--navy);
      font-size: 2rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.8rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: var(--gold);
    }
    p {
      font-size: 1rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.65);
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.85rem 2.2rem;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">✓</div>
    <h1>Заявка отправлена!</h1>
    <p>Кирилл получил вашу заявку и свяжется с вами в течение 24 часов, чтобы согласовать удобное время.</p>
    <a href="index.html">Вернуться на сайт</a>
  </div>
</body>
</html>
