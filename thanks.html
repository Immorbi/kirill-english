<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявка отправлена — Кирилл Д.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #0f172a; --gold: #6366f1; --gold-light: #818cf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--navy);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 480px; }
    .icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: white;
      font-size: 2rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      box-shadow: 0 8px 32px rgba(99,102,241,0.45);
    }
    h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: 2.8rem;
      font-weight: 400;
      margin-bottom: 1rem;
      color: white;
    }
    p {
      font-size: 1rem;
      line-height: 1.8;
      color: rgba(255,255,255,0.6);
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      background: var(--gold);
      color: white;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.85rem 2.2rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
    }
    a:hover { background: var(--gold-light); box-shadow: 0 8px 24px rgba(99,102,241,0.4); transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">✓</div>
    <h1>Заявка отправлена!</h1>
    <p>Кирилл получил вашу заявку и свяжется с вами в течение 24 часов, чтобы согласовать удобное время.</p>
    <a href="index.html">Вернуться на сайт</a>
  </div>
</body>
</html>
